<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Theme before first paint so there is no flash: ?theme=light|dark
      // (Pits n' Giggles or a test can force one), else the system setting,
      // followed live. index.css styles :root[data-theme="light"].
      (function () {
        var media = window.matchMedia("(prefers-color-scheme: light)");
        var forced = new URLSearchParams(location.search).get("theme");
        function apply() {
          document.documentElement.dataset.theme =
            forced === "light" || forced === "dark"
              ? forced
              : media.matches
                ? "light"
                : "dark";
        }
        apply();
        media.addEventListener("change", apply);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>F1 Telemetry Viewer</title>
    <meta
      name="description"
      content="Visualize your F1 game telemetry data — lap times, tyre wear, sector splits, and more."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="F1 Telemetry Viewer" />
    <meta
      property="og:description"
      content="Visualize your F1 game telemetry data — lap times, tyre wear, sector splits, and more."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="F1 Telemetry Viewer" />
    <meta
      name="twitter:description"
      content="Visualize your F1 game telemetry data — lap times, tyre wear, sector splits, and more."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body class="bg-tone-950 text-tone-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
